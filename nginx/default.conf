server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s;

    location /api/order/ {
        set $up http://order-service:8081;
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /api/restaurant/ {
        set $up http://restaurant-service:8086;
        rewrite ^/api/restaurant/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /api/delivery/ {
        set $up http://delivery-service:8083;
        rewrite ^/api/delivery/(.*)$ /$1 break;
        proxy_pass $up;
    }
    location /api/admin/ {
        set $up http://admin-service:8085;
        rewrite ^/api/admin/(.*)$ /$1 break;
        proxy_pass $up;
    }
}