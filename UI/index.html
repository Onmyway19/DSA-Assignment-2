<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer - Place Order</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="active">Customer</a>
            <a href="restaurant.html">Restaurant</a>
            <a href="driver.html">Driver</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h1>Customer Portal</h1>
            <label>Customer ID:</label>
            <input type="text" id="customerId" value="CUST-101">
            <label>Restaurant ID:</label>
            <input type="text" id="restaurantId" value="REST-201">
            <label>Item Name:</label>
            <input type="text" id="itemName" value="Kapana Combo">
            <label>Price ($):</label>
            <input type="number" id="itemPrice" value="85.00">
            <button onclick="createOrder()">Place Order</button>
            <pre id="output">// Response will appear here...</pre>
        </div>
    </div>
    <script>
        async function createOrder() {
            const payload = {
                customerId: document.getElementById('customerId').value,
                restaurantId: document.getElementById('restaurantId').value,
                items: [{ name: document.getElementById('itemName').value, price: parseFloat(document.getElementById('itemPrice').value) }]
            };
            try {
                const res = await fetch('http://localhost:8081/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('output').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('output').innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
