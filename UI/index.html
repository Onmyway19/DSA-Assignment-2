<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place an order</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav><a href="index.html" aria-current>Customer</a><a href="restaurant.html">Restaurant</a><a href="driver.html">Driver</a><a href="admin.html">Admin</a></nav>
<main>
<h1>Place an order</h1>
<p class="hint">Creates an order and remembers its ID for the other pages.</p>
<form onsubmit="return false">
<div class="row"><label>Customer ID<input id="customerId" value="c1"></label><label>Restaurant ID<input id="restaurantId" value="r1"></label></div>
<div class="row"><label>Item<input id="item" value="Burger"></label><label>Price<input id="price" type="number" step="0.01" value="50"></label></div>
<div class="row"><label>Quantity<input id="qty" type="number" min="1" value="1"></label><label>Delivery address<input id="address" value="1 Main St"></label></div>
<label>Order ID<input id="orderId" placeholder="Filled in after you place an order"></label>
<div class="actions"><button onclick="placeOrder()">Place order</button><button class="alt" onclick="track()">Check order status</button></div>
</form>
<pre id="out" aria-live="polite"></pre>
</main>
<script src="app.js"></script>
<script>
$('orderId').value = lastOrder();
async function placeOrder() {
  const o = await call('POST', '/api/order/orders', {
    customerId: val('customerId'), restaurantId: val('restaurantId'),
    items: [{menuItemId: 'm1', name: val('item'), quantity: parseInt(val('qty')), unitPrice: parseFloat(val('price'))}],
    deliveryAddress: val('address')
  });
  if (o && o.id) { rememberOrder(o.id); $('orderId').value = o.id; }
}
function track() { call('GET', '/api/order/orders/' + enc('orderId')); }
</script>
</body>
</html>
