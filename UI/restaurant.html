<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Customer</a>
            <a href="restaurant.html" class="active">Restaurant</a>
            <a href="driver.html">Driver</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h1>Restaurant Order Lifecycle</h1>
            <label>Order ID:</label>
            <input type="text" id="restOrderId" placeholder="e.g. ORD-1001">
            <label>Update Order Status:</label>
            <select id="restStatus">
                <option value="PREPARING">PREPARING</option>
                <option value="READY">READY</option>
                <option value="CANCELLED">CANCELLED</option>
            </select>
            <button onclick="updateStatus()">Update Status</button>
            <pre id="output">// Response will appear here...</pre>
        </div>
    </div>
    <script>
        async function updateStatus() {
            const orderId = document.getElementById('restOrderId').value;
            const status = document.getElementById('restStatus').value;
            try {
                const res = await fetch(`http://localhost:8086/restaurant/orders/${orderId}/status`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                const data = await res.json();
                document.getElementById('output').innerText = JSON.stringify(data, null, 2);
            } catch (err) {
                document.getElementById('output').innerText = "Error: " + err.message;
            }
        }
    </script>
</body>
</html>
