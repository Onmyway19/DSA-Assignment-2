<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav><a href="index.html">Customer</a><a href="restaurant.html" aria-current>Restaurant</a><a href="driver.html">Driver</a><a href="admin.html">Admin</a></nav>
<main>
<h1>Update an order</h1>
<p class="hint">Tell the platform how the kitchen is doing. The restaurant must exist first.</p>
<form onsubmit="return false">
<div class="row"><label>Restaurant ID<input id="restaurantId" value="r1"></label><label>Order ID<input id="orderId"></label></div>
<label>Status<select id="status"><option>PREPARING</option><option>READY</option><option>REJECTED</option></select></label>
<div class="actions"><button onclick="setStatus()">Update order status</button><button class="alt" onclick="createDemo()">Create restaurant</button></div>
</form>
<pre id="out" aria-live="polite"></pre>
</main>
<script src="app.js"></script>
<script>
$('orderId').value = lastOrder();
function setStatus() {
  call('POST', '/api/restaurant/restaurants/' + enc('restaurantId') + '/orders/' + enc('orderId') + '/status', {status: val('status')});
}
function createDemo() {
  call('POST', '/api/restaurant/restaurants', {_id: val('restaurantId'), name: 'Demo restaurant', cuisineType: 'Burgers', isOpen: true, openingTime: '08:00', closingTime: '22:00', menu: []});
}
</script>
</body>
</html>
