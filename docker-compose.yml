services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["./kafka/create-topics.sh:/create-topics.sh"]
    entrypoint: ["/bin/sh", "/create-topics.sh", "kafka:9092"]

  order-mongo:
    image: mongo:7
    volumes: ["order-mongo-data:/data/db"]
    ports: ["27017:27017"]

  order-service:
    build: ./order-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      order-mongo: { condition: service_started }
    ports: ["8081:8081", "8091:8091"]
    restart: on-failure

  payment-mongo:
    image: mongo:7
    volumes: ["payment-mongo-data:/data/db"]
    ports: ["27018:27017"]

  payment-service:
    build: ./payment-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      payment-mongo: { condition: service_started }
    ports: ["8082:8082", "8096:8092"]
    restart: on-failure

  delivery-mongo:
    image: mongo:7
    volumes: ["delivery-mongo-data:/data/db"]
    ports: ["27019:27017"]

  delivery-service:
    build: ./delivery-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      delivery-mongo: { condition: service_started }
    ports: ["8083:8083", "8093:8093"]
    restart: on-failure

  notification-mongo:
    image: mongo:7
    volumes: ["notification-mongo-data:/data/db"]

  notification-service:
    build: ./notification-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      notification-mongo: { condition: service_started }
    environment:
      BAL_CONFIG_VAR_EMAILWEBHOOK: ${EMAIL_WEBHOOK:-}
      BAL_CONFIG_VAR_SMSWEBHOOK: ${SMS_WEBHOOK:-}
      BAL_CONFIG_VAR_PUSHWEBHOOK: ${PUSH_WEBHOOK:-}
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:9092
      BAL_CONFIG_VAR_MONGOURL: mongodb://notification-mongo:27017
    ports: ["8092:8092"]
    restart: on-failure

  admin-mongo:
    image: mongo:7
    volumes: ["admin-mongo-data:/data/db"]

  admin-service:
    build: ./admin-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      admin-mongo: { condition: service_started }
    ports: ["8085:8085", "8095:8095"]
    restart: on-failure

  customer-mongo:
    image: mongo:7
    volumes: ["customer-mongo-data:/data/db"]
    ports: ["27020:27017"]

  customer-service:
    build: ./customer_service
    depends_on:
      customer-mongo: { condition: service_started }
    environment:
      BAL_CONFIG_VAR_DBURL: mongodb://customer-mongo:27017
    ports: ["8084:8084"]
    restart: on-failure

  restaurant-mongo:
    image: mongo:7
    volumes: ["restaurant-mongo-data:/data/db"]
    ports: ["27021:27017"]

  restaurant-service:
    build: ./restaurant_service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      restaurant-mongo: { condition: service_started }
    environment:
      BAL_CONFIG_VAR_DBURL: mongodb://restaurant-mongo:27017
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:9092
    ports: ["8086:8086"]
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: food-delivery-ui
    ports:
      - "80:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  order-mongo-data:
  payment-mongo-data:
  delivery-mongo-data:
  notification-mongo-data:
  admin-mongo-data:
  customer-mongo-data:
  restaurant-mongo-data: