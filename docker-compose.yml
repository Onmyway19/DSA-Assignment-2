services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes: ["./kafka/create-topics.sh:/create-topics.sh"]
    entrypoint: ["/bin/sh", "/create-topics.sh", "kafka:9092"]

  order-mongo:
    image: mongo:7
    volumes: ["order-mongo-data:/data/db"]
    ports: ["27017:27017"]

  order-service:
    build: ./order-service
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      order-mongo: { condition: service_started }
    ports: ["8081:8081", "8091:8091"]
    restart: on-failure

  # Teammates: add customer-service, restaurant-service, payment-service,
  # delivery-service, notification-service, admin-service below, each with its own DB.

volumes:
  order-mongo-data:
